<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Le Baliseur · Audit</title>
<style>
:root{--ink:#1d2a24;--muted:#5d6a63;--green:#24493A;--green2:#3c7a5f;--amber:#F2B23A;--red:#C2410C;
  --bg:#F6F3EC;--card:#fff;--line:#e3ddd0;--soft:#efeadf}
@media (prefers-color-scheme:dark){:root{--ink:#ece8df;--muted:#9aa69f;--bg:#121815;--card:#1b231f;--line:#2c3832;--soft:#232d28;--green:#7fb69a;--green2:#7fb69a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--green2)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer}
.post{display:inline-block;width:9px;height:20px;background:var(--amber);border-radius:2px;margin-right:8px;vertical-align:-3px}
main{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
button,.btn{font:inherit;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#0f1512}}
button:disabled{opacity:.55;cursor:wait}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.badge{display:inline-grid;place-items:center;min-width:44px;height:30px;border-radius:8px;font-weight:700;color:#fff;padding:0 8px}
.delta{font-size:13px;font-weight:600}.up{color:#2e8b57}.down{color:var(--red)}
.grid{display:grid;gap:16px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:220px 1fr}}
.gauge{text-align:center}.gauge svg{width:180px;height:180px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;justify-content:space-between;gap:8px}
.plan li{margin-bottom:10px}.plan ul{padding-left:18px;margin:0}
.gain{font-size:12px;font-weight:700;background:var(--soft);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.st{font-weight:700}.st.ok{color:#2e8b57}.st.part{color:#b7791f}.st.bad{color:var(--red)}.st.na{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.found{background:var(--soft);border-radius:10px;padding:12px;margin-top:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 10px}
.clientrow{cursor:pointer}.clientrow:hover{background:var(--soft)}
.chg li{margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--soft);border-radius:9px;padding:6px 10px;font-size:13px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-size:13px;font-weight:600}
.rs th,.rs td{padding:7px 5px}.mini{display:inline-block;min-width:30px;text-align:center;border-radius:6px;font-size:12px;font-weight:700;color:#fff;padding:1px 4px}
.pick{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.pick label{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:0;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:auto;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto;padding:8px}
.answer{font-size:13px;white-space:pre-wrap;margin:8px 0;max-height:320px;overflow:auto;background:var(--soft);border-radius:9px;padding:10px}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;border-color:#ccc}main{padding:0}}
</style></head><body>
<header><h1 onclick="location.hash=''"><span class="post"></span>Le Baliseur Audit</h1>
<a class="btn noprint" href="#/research">Research</a>
<button class="primary noprint" onclick="openAdd()">+ Client</button>
<a class="btn noprint" href="/logout">Sign out</a></header>
<main id="main"></main>

<dialog id="add"><form onsubmit="return false">
<h2>New client</h2>
<label>Business name</label><input id="f-name" placeholder="e.g. Caroline Lillaz psychologue" required>
<div class="grid g2"><div><label>Town</label><input id="f-city" value="Annecy"></div>
<div><label>Activity (for the map search)</label><input id="f-cat" placeholder="e.g. psychologue"></div></div>
<label>Website <span class="muted">(optional, found on Google if empty)</span></label><input id="f-site" placeholder="https://…">
<label>Main search to track <span class="muted">(optional, default “activity town”)</span></label><input id="f-query" placeholder="e.g. psychologue Annecy">
<div id="f-found"></div>
<div class="actions"><button type="button" onclick="add.close()">Cancel</button>
<button type="button" id="f-look" onclick="lookup()">Find on Google</button>
<button type="button" class="primary" id="f-go" onclick="createClient()">Add &amp; audit</button></div>
</form></dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const col = (n) => n == null ? "#8a948f" : n >= 80 ? "#2e7d57" : n >= 50 ? "#c98a12" : "#C2410C";
const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}) : "–";
let found = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"content-type": "application/json"}, ...opts});
  if (r.status === 401) { location.reload(); throw new Error("login"); }
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); }
  catch {
    // Not JSON: a Cloudflare error page. Show its code and title ("Error 1102 … exceeded resource limits").
    const t = (text.match(/<title>([^<]*)<\/title>/i) || [])[1] || "";
    throw new Error("Cloudflare returned an error page (HTTP " + r.status + ")" + (t ? ": " + t.trim() : ""));
  }
  if (!r.ok || j.error && !j.date && !j.place) throw new Error(j.error || "Error " + r.status);
  return j;
}

// ---------- Client list ----------
async function list() {
  $("#main").innerHTML = '<p class="muted"><span class="spin"></span>Loading…</p>';
  const [cs, leads] = await Promise.all([api("/api/clients"), api("/api/leads")]);
  const leadsHtml = '<div class="card"><h2>Leads from the public check (' + leads.length + ')</h2>' + (leads.length ?
    '<div class="tablewrap"><table><thead><tr><th>Score</th><th>Business</th><th>Contact</th><th>Date</th><th></th></tr></thead><tbody>' +
    leads.map((l) => '<tr' + (l.client_id ? ' class="clientrow" onclick="location.hash=\'#/c/' + l.client_id + '\'"' : '') + '><td><span class="badge" style="background:' + col(l.total) + '">' + (l.total ?? "–") + '</span></td><td><strong>' + esc(l.business) + '</strong><div class="muted small">' + esc([l.category, l.city].filter(Boolean).join(" · ")) + (l.search ? ' · « ' + esc(l.search) + ' »' : "") + (l.fb_useful === 1 ? ' · 👍' : l.fb_useful === 0 ? ' · 👎' : "") + (l.fb_comment ? '<br><em>« ' + esc(l.fb_comment) + ' »</em>' : "") + (l.status !== "done" ? ' · ' + esc(l.status) : "") + (l.client_id && !l.prospect ? ' · client' : "") + '</div></td><td>' + esc(l.first_name || "") + ' <a href="mailto:' + esc(l.email) + '" onclick="event.stopPropagation()">' + esc(l.email) + '</a>' + (l.phone ? '<div class="small"><a href="tel:' + esc(l.phone) + '" onclick="event.stopPropagation()">' + esc(l.phone) + '</a></div>' : "") + '</td><td class="small">' + fmtDate(l.date + "Z") + '</td><td class="noprint"><button onclick="event.stopPropagation();delLead(' + l.id + ')" title="Delete (RGPD request)">✕</button></td></tr>').join("") +
    '</tbody></table></div>' : '<p class="muted small">No one has used the public check yet. Its address is <a href="/diagnostic" target="_blank">/diagnostic</a>.</p>') + '</div>';
  if (!cs.length) {
    $("#main").innerHTML = leadsHtml + '<div class="card empty"><h2>No clients yet</h2><p class="muted">Add a business name and the tool does the rest: Google profile, map position, site crawl, speed test, score and plan.</p><button class="primary" onclick="openAdd()">+ Add the first client</button></div>';
    return;
  }
  $("#main").innerHTML = '<div class="card"><h2>Clients</h2><div class="tablewrap"><table><thead><tr><th>Score</th><th>Business</th><th>Search tracked</th><th>Last audit</th><th></th></tr></thead><tbody>' +
    cs.map((c) => {
      const d = c.total != null && c.prev_total != null ? c.total - c.prev_total : null;
      return '<tr class="clientrow" onclick="location.hash=\'#/c/' + c.id + '\'"><td><span class="badge" style="background:' + col(c.total) + '">' + (c.total ?? "–") + '</span> ' +
        (d ? '<span class="delta ' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "+" : "") + d + '</span>' : "") +
        '</td><td><strong>' + esc(c.name) + '</strong><div class="muted small">' + esc(c.site || "website not set") + '</div></td><td>' +
        esc(c.query || [c.category, c.city].filter(Boolean).join(" ")) + '</td><td>' + fmtDate(c.last_date) + '</td><td class="noprint"><button onclick="event.stopPropagation();runAudit(' + c.id + ', this)">Audit now</button></td></tr>';
    }).join("") + '</tbody></table></div><p class="muted small">Every client is re-audited automatically about once a month.</p></div>' + leadsHtml;
}

// ---------- Add client ----------
function openAdd() { found = null; $("#f-found").innerHTML = ""; ["name","site","query","cat"].forEach((k) => $("#f-" + k).value = ""); add.showModal(); }
async function lookup() {
  const b = $("#f-look"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Searching';
  try {
    const r = await api("/api/lookup", {method: "POST", body: JSON.stringify({name: $("#f-name").value, city: $("#f-city").value})});
    found = r.place;
    $("#f-found").innerHTML = '<div class="found"><strong>' + esc(found.name) + '</strong> · ' + esc(found.category || "") +
      '<div class="small">' + esc(found.address) + '</div><div class="small">' + (found.website ? esc(found.website) : "No website on Google") +
      ' · ' + (found.rating ?? "–") + '★ (' + found.reviews + ')</div><div class="small muted">Not the right one? Add more of the name or the street, then search again.</div></div>';
    if (!$("#f-site").value && found.website) $("#f-site").value = found.website;
  } catch (e) { $("#f-found").innerHTML = '<div class="found">' + esc(e.message) + '. You can still add it with a website.</div>'; }
  b.disabled = false; b.textContent = "Find on Google";
}
async function createClient() {
  if (!$("#f-name").value.trim()) return $("#f-name").focus();
  const b = $("#f-go"); b.disabled = true;
  const r = await api("/api/clients", {method: "POST", body: JSON.stringify({
    name: $("#f-name").value, city: $("#f-city").value, category: $("#f-cat").value,
    site: $("#f-site").value, query: $("#f-query").value, place_id: found?.id})});
  b.disabled = false; add.close();
  location.hash = "#/c/" + r.id + "/run";
}

// ---------- Audit ----------
async function runAudit(id, btn) {
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Auditing… (about a minute)'; }
  try { await api("/api/clients/" + id + "/audit", {method: "POST"}); }
  catch (e) { alert("Audit failed: " + e.message); }
  if (location.hash === "#/c/" + id) show(id); else location.hash = "#/c/" + id;
}

// ---------- Client report ----------
// "Found without your name": map position + named by AI for the activity. Older audits were saved
// before this score existed, so it is worked out from their results when missing.
const FOUND = {map_rank: "Google Maps", ai_recommended: "AI assistants"};
function foundOf(L) {
  if (L.score && L.score.found) return L.score.found;
  const parts = (L.results || []).filter((r) => FOUND[r.id] && r.fraction !== null)
    .map((r) => ({id: r.id, name: FOUND[r.id], earned: r.earned, points: r.points, detail: r.detail}));
  const p = parts.reduce((n, x) => n + x.points, 0);
  return {pct: p ? Math.round(100 * parts.reduce((n, x) => n + x.earned, 0) / p) : null, parts};
}
function foundCard(L) {
  const f = foundOf(L);
  if (f.pct == null) return "";
  return '<div class="card"><div class="row"><h2 style="margin:0">Found without your name</h2><span class="badge" style="background:' + col(f.pct) + '">' + f.pct + '%</span></div>' +
    '<p class="small muted" style="margin:6px 0 10px">What a customer sees when they search for the activity and town, not the business name. The overall score also counts things customers never see (speed, tags, legal pages), so a business can score well and still be hard to find.</p>' +
    f.parts.map((x) => '<div class="row"><span>' + esc(x.name) + '</span><strong>' + x.earned + ' / ' + x.points + '</strong></div><div class="small muted" style="margin-bottom:8px">' + esc(x.detail) + '</div>').join("") + '</div>';
}
function gauge(n) {
  const r = 70, c = 2 * Math.PI * r, f = (n || 0) / 100;
  return '<svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--soft)" stroke-width="16"/>' +
    '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="' + col(n) + '" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + (c * f) + ' ' + c + '" transform="rotate(-90 90 90)"/>' +
    '<text x="90" y="98" text-anchor="middle" font-size="44" font-weight="700" fill="currentColor">' + (n ?? "–") + '</text><text x="90" y="122" text-anchor="middle" font-size="13" fill="var(--muted)">out of 100</text></svg>';
}
function history(runs) {
  if (runs.length < 2) return '<p class="muted small">The score history appears after the second audit.</p>';
  const W = 600, H = 160, P = 28, xs = (i) => P + i * (W - 2 * P) / (runs.length - 1), ys = (v) => H - P - v / 100 * (H - 2 * P);
  const pts = runs.map((r, i) => xs(i) + "," + ys(r.total)).join(" ");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
    [0, 50, 100].map((v) => '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + ys(v) + '" y2="' + ys(v) + '" stroke="var(--line)"/><text x="4" y="' + (ys(v) + 4) + '" font-size="11" fill="var(--muted)">' + v + '</text>').join("") +
    '<polyline points="' + pts + '" fill="none" stroke="var(--green2)" stroke-width="3"/>' +
    runs.map((r, i) => '<circle cx="' + xs(i) + '" cy="' + ys(r.total) + '" r="4" fill="var(--green2)"/><text x="' + xs(i) + '" y="' + (ys(r.total) - 9) + '" font-size="12" text-anchor="middle" fill="currentColor">' + r.total + '</text><text x="' + xs(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="var(--muted)">' + new Date(r.date).toLocaleDateString("en-GB", {month: "short", year: "2-digit"}) + '</text>').join("") + '</svg>';
}
// Map position: a dot per search point, green = top 3, amber = 4 to 10, red = lower or not found.
const rankCol = (r) => r == null ? "#d9534f" : r <= 3 ? "#2e9e5b" : r <= 10 ? "#e0a030" : "#d9534f";
function gridSvg(points, qi) {
  const S = 52, W = S * 3;
  return '<svg viewBox="0 0 ' + W + ' ' + W + '" style="width:150px;height:150px">' +
    '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (W - 2) + '" rx="10" fill="none" stroke="var(--line)"/>' +
    points.map((p) => { const r = p.ranks[qi], x = (p.dx + 1.5) * S, y = (1.5 - p.dy) * S, me = p.dx === 0 && p.dy === 0;
      return '<circle cx="' + x + '" cy="' + y + '" r="17" fill="' + rankCol(r) + '"' + (me ? ' stroke="currentColor" stroke-width="2.5"' : "") + '/>' +
        '<text x="' + x + '" y="' + (y + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">' + (r ?? "20+") + '</text>'; }).join("") + '</svg>';
}
function mapCard(rk, sites) {
  if (rk.out_of == null) return '<p class="muted">' + esc(rk.error || "Not checked") + '</p>';
  const comp = rk.competitors?.length ? '<h3>Ahead or around (from the business)</h3><table>' + rk.competitors.map((x) => '<tr><td>' + esc(x.name) + '</td><td>' + (x.rating ?? "–") + '★ (' + x.reviews + ')</td>' +
    (sites ? '<td class="small">' + (x.website ? '<a href="' + esc(x.website) + '" target="_blank" rel="noopener">site</a>' : "none") + '</td>' : "") + '</tr>').join("") + '</table>' : "";
  if (!rk.points) return '<p>“' + esc(rk.query) + '”: <strong>' + (rk.rank ? "#" + rk.rank : "not in top " + rk.out_of) + '</strong> <span class="small muted">(single search, older audit)</span></p>' + comp;
  return '<p><strong>Top 3 in ' + rk.top3 + ' of ' + rk.cells + ' searches</strong>' + (rk.found ? ' · average position ' + rk.avg + ' · best ' + rk.best + ' · worst ' + (rk.worst ?? "20+") : ' · not in the top 20 anywhere') + '</p>' +
    '<div style="display:flex;gap:18px;flex-wrap:wrap">' + rk.queries.map((q, qi) => '<div><div class="small"><strong>“' + esc(q) + '”</strong></div>' + gridSvg(rk.points, qi) + '</div>').join("") + '</div>' +
    '<p class="small muted">Searched from ' + rk.points.length + ' points ' + rk.km + ' km apart around the business (circled dot = the business, north at the top). Estimated from Google data: results on a personal phone also depend on the person\'s exact location and search history.</p>' + comp;
}
const status = (f) => f == null ? '<span class="st na">–</span>' : f >= 0.95 ? '<span class="st ok">✓</span>' : f >= 0.4 ? '<span class="st part">◐</span>' : '<span class="st bad">✗</span>';

async function show(id, autorun) {
  $("#main").innerHTML = '<p class="muted"><span class="spin"></span>Loading…</p>';
  const d = await api("/api/clients/" + id);
  const c = d.client, L = d.latest, S = d.sectionNames;
  let h = '<div class="row noprint" style="margin-bottom:12px;flex-wrap:wrap"><a href="#" class="btn">← All clients</a><span style="display:flex;gap:8px;flex-wrap:wrap">' +
    (c.prospect ? '<button onclick="convert(' + id + ')">Make client</button>' : "") + '<button onclick="window.print()">Print / PDF</button><button onclick="del(' + id + ')">Delete</button><button class="primary" id="runbtn" onclick="runAudit(' + id + ', this)">Run audit now</button></span></div>' +
    '<div class="card"><h2 style="font-size:22px;margin:0">' + esc(c.name) + (c.prospect ? ' <span class="gain">PROSPECT</span>' : "") + '</h2><div class="muted">' + esc([c.category, c.city].filter(Boolean).join(" · ")) +
    (L?.site ? ' · <a href="' + esc(L.site) + '" target="_blank" rel="noopener">' + esc(L.site.replace(/^https?:\/\//, "")) + '</a>' : "") +
    (L?.google?.maps_url ? ' · <a href="' + esc(L.google.maps_url) + '" target="_blank" rel="noopener">Google Maps</a>' : "") + '</div></div>';
  if (!L) {
    $("#main").innerHTML = h + '<div class="card empty"><h2>No audit yet</h2><p class="muted">Run the first audit to get the baseline score.</p></div>';
    if (autorun) runAudit(id, $("#runbtn"));
    return;
  }
  const sc = L.score;
  h += (L.warning ? '<div class="card" style="border-color:var(--red)"><strong class="down">Partial result.</strong> ' + esc(L.warning) + '</div>' : "");
  h += '<div class="grid hero"><div class="card gauge">' + gauge(sc.total) + '<div class="small muted">Audited ' + fmtDate(L.date) +
    (sc.coverage < 100 ? '<br>' + sc.coverage + '% of checks could run' : "") + '</div></div><div class="card"><h2>By area</h2>' +
    Object.entries(S).map(([k, name]) => {
      const s = sc.sections[k] || {pct: null}; // areas added after this audit was saved
      return '<div class="row"><span>' + name + '</span><strong>' + (s.pct == null ? "not checked" : s.pct + "%") + '</strong></div><div class="bar"><i style="width:' + (s.pct || 0) + '%;background:' + col(s.pct) + '"></i></div>';
    }).join("") + '</div></div>';
  h += foundCard(L);

  if (L.changes) {
    const ch = L.changes, dd = ch.total_delta;
    h += '<div class="card"><h2>Since ' + fmtDate(ch.prev_date) + ': <span class="' + (dd >= 0 ? "up" : "down") + '">' + (dd > 0 ? "+" : "") + dd + ' points</span></h2><div class="grid g2"><div><h3>Improved</h3>' +
      (ch.fixed.length ? '<ul class="chg">' + ch.fixed.map((x) => '<li><strong>' + esc(x.label) + '</strong><div class="small muted">' + esc(x.to) + '</div></li>').join("") + '</ul>' : '<p class="muted small">Nothing yet.</p>') +
      '</div><div><h3>Got worse</h3>' + (ch.worse.length ? '<ul class="chg">' + ch.worse.map((x) => '<li><strong>' + esc(x.label) + '</strong><div class="small muted">' + esc(x.to) + '</div></li>').join("") + '</ul>' : '<p class="muted small">Nothing.</p>') + '</div></div></div>';
  }

const ENG = {chatgpt: "ChatGPT", perplexity: "Perplexity", gemini: "Gemini"};
function aiCard(ai, test) {
  let h = '<h2>What AI assistants answer' + (test ? ' <span class="gain">TEST · NOT SAVED</span>' : '') + '</h2>';
  if (!ai || ai.error) return h + '<p class="muted small">Not checked' + (ai?.error ? ': ' + esc(ai.error) : '') +
    '. Add at least one of the secrets PERPLEXITY_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY to the Worker.</p>';
  h += '<div class="chips">' + Object.values(ai.per_engine).map((e) => '<span class="chip"><strong>' + esc(e.label) + '</strong> named ' + e.named + '/' + e.of +
    (e.knows === null ? '' : ' · ' + (e.knows ? 'knows you ✓' : "doesn't know you")) + (e.errors ? ' · <span class="down">' + e.errors + ' failed</span>' : '') + '</span>').join('') + '</div>';
  const qs = [...new Set(ai.answers.map((a) => a.q))];
  h += '<div class="tablewrap"><table><thead><tr><th>Question</th>' + ai.engines.map((e) => '<th>' + ENG[e] + '</th>').join('') + '</tr></thead><tbody>' +
    qs.map((q) => '<tr><td class="small">' + esc(q) + '</td>' + ai.engines.map((e) => {
      const a = ai.answers.find((x) => x.q === q && x.engine === e);
      if (!a || a.error) return '<td title="' + esc(a?.error) + '"><span class="st na">⚠</span></td>';
      return '<td>' + (a.named ? '<span class="st ok">✓</span>' + (a.position ? ' #' + a.position : '') : '<span class="st bad">✗</span>') +
        (a.cites_site ? '<div class="small muted">site cited</div>' : '') + '</td>';
    }).join('') + '</tr>').join('') + '</tbody></table></div>';
  h += '<div class="grid g2" style="margin-top:12px"><div><h3>Sites they rely on</h3>' + (ai.top_domains.length ? '<ul class="small">' + ai.top_domains.map((d) => '<li>' + esc(d.name) + ' <span class="muted">×' + d.n + '</span></li>').join('') + '</ul><p class="muted small">Being listed and reviewed on these is the fastest way into the answers.</p>' : '<p class="muted small">No sources returned.</p>') +
    '</div><div><h3>Map competitors they name</h3>' + (ai.competitors_named.length ? '<ul class="small">' + ai.competitors_named.map((c) => '<li>' + esc(c.name) + ' <span class="muted">×' + c.n + '</span></li>').join('') + '</ul>' : '<p class="muted small">None of the top map competitors.</p>') + '</div></div>';
  if (ai.errors?.length) h += '<p class="small down">' + esc(ai.errors.join(' · ')) + '</p>';
  h += '<h3 style="margin-top:12px">Full answers</h3>' + ai.answers.map((a) => '<details><summary>' + ENG[a.engine] + ' · ' + esc(a.q) + (a.error ? ' ⚠' : a.named ? ' ✓' : ' ✗') + '</summary>' +
    (a.error ? '<p class="small down">' + esc(a.error) + '</p>' : '<div class="answer">' + esc(a.text) + '</div>' +
    (a.sources.length ? '<div class="small">Sources: ' + a.sources.map((x) => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.domain) + '</a>').join(', ') + '</div>' : '')) + '</details>').join('');
  return h;
}

const SHORT = {tech: "Tech", onpage: "SEO", local: "Google", aeo: "AI-ready", trust: "Trust", aivis: "AI named"};
let rsFound = [], rsRows = [], rsBusy = false;
const rsState = (() => { try { return JSON.parse(localStorage.getItem("rs") || "{}"); } catch { return {}; } })();

async function rsFind() {
  const act = $("#rs-act").value.trim(), city = $("#rs-city").value.trim();

  rsState.act = act; rsState.city = city; rsSave();

function rsFromPaste() {

  rsFound = $("#rs-paste").value.split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 40).map((l) => {

function rsPick() {

  $("#rs-pick").innerHTML = '<div class="pick">' + rsFound.map((p, i) => '<label><input type="checkbox" class="rs-cb" data-i="' + i + '"' + (p.seen ? "" : " checked") + '><span><strong>' + esc(p.name) + '</strong>' +

async function rsRun() {
  if (rsBusy) return;
  const todo = [...document.querySelectorAll(".rs-cb:checked")].map((c) => rsFound[+c.dataset.i]);
  if (!todo.length) return;
  const ai = $("#rs-ai").checked;
  rsBusy = true; const b = $("#rs-go"); b.disabled = true;
  let done = 0, failed = [];
  const prog = () => { $("#rs-prog").innerHTML = '<span class="spin"></span>' + done + " of " + todo.length + " done · about a minute each, two at a time. Keep this tab open."; };
  prog();
  const queue = [...todo];
  // Two at a time: fast enough, and each audit stays its own request within Cloudflare's limits.
  const worker = async () => {
    while (queue.length) {
      const p = queue.shift();
      try { await api("/api/research/audit", {method: "POST", body: JSON.stringify({...p, ai})}); }
      catch (e) { failed.push(p.name + ": " + e.message); }
      done++; prog();
    }
  };
  await Promise.all([worker(), worker()]);
  rsBusy = false; b.disabled = false;
  $("#rs-prog").innerHTML = "Finished " + (todo.length - failed.length) + " of " + todo.length + (failed.length ? '<div class="down">' + failed.map(esc).join("<br>") + "</div>" : "");
  rsState.batch = todo[0].batch; rsSave();
  rsRows = await api("/api/research"); rsTable();
}

    '<div class="card"><h2>Map position</h2>' + mapCard(rk, false) + '</div></div>';
  if (L.ai && !L.ai.error) h += '<div class="card">' + aiCard(L.ai) + '</div>';
  h += '<div class="card"><h2>All checks</h2><div class="tablewrap"><table><tbody>' + Object.keys(S).map((k) => { const rs = L.results.filter((x) => x.section === k); return rs.length ? '<tr><th colspan="4" style="padding-top:16px">' + S[k] + '</th></tr>' + rs.map((x) =>
    '<tr><td>' + status(x.fraction) + '</td><td>' + esc(x.label) + '</td><td class="small">' + esc(x.detail) + '</td><td>' + (x.earned ?? "–") + '/' + x.points + '</td></tr>').join("") : ""; }).join("") + '</tbody></table></div></div>';
  $("#main").innerHTML = h;
}
async function rsProspect(id, b) {
  b.disabled = true;
  try { const r = await api("/api/research/" + id + "/prospect", {method: "POST"}); location.hash = "#/c/" + r.id; }
  catch (e) { alert(e.message); b.disabled = false; }
}

function route() {
  const m = location.hash.match(/^#\/c\/(\d+)(\/run)?/), rm = location.hash.match(/^#\/r\/(\d+)/);
  (m ? show(+m[1], !!m[2]) : rm ? researchShow(+rm[1]) : location.hash === "#/research" ? research() : list()).catch((e) => { $("#main").innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
}
window.addEventListener("hashchange", route); route();
</script></body></html>
